<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCAT 適性検査トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e8ec; --panel:#f6f8f9; --panel2:#eceff2; --ink:#13243a; --muted:#56657a; --line:#c9d1d9;
  --accent:#e2670f; --accent-ink:#ffffff; --ok:#13804a; --ng:#c42b2b; --sel:#1d5fbf;
  --obs:#3b4a5c; --tunnel:#d3dae1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --panel:#18202a; --panel2:#1f2833; --ink:#e6ecf2; --muted:#93a2b3; --line:#2c3846;
    --accent:#f47d22; --accent-ink:#1b0e03; --ok:#3fcf86; --ng:#ff6f6f; --sel:#6aa5ff;
    --obs:#8a9bb0; --tunnel:#232d39;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#18202a; --panel2:#1f2833; --ink:#e6ecf2; --muted:#93a2b3; --line:#2c3846;
  --accent:#f47d22; --accent-ink:#1b0e03; --ok:#3fcf86; --ng:#ff6f6f; --sel:#6aa5ff;
  --obs:#8a9bb0; --tunnel:#232d39;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
.num{font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
kbd{font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:.75em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 .35em;margin-left:.4em;color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.screen[hidden]{display:none}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin:8px 0 28px}
.hero svg{width:96px;height:96px}
.hero h1{font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:2.4rem;line-height:1.1;margin:0;letter-spacing:.01em}
.hero h1 small{display:block;font-family:"BIZ UDPGothic",system-ui,sans-serif;font-size:1rem;font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:0}
.lede{max-width:64ch;color:var(--muted);margin:0 0 20px}
.mods{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.mod{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.mod:hover{background:var(--panel)}
.mod .no{font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:2rem;font-weight:700;color:var(--accent);line-height:1}
.mod .nm{font-weight:700;font-size:1.1rem}
.mod .sm{display:block;color:var(--muted);font-size:.9rem;line-height:1.5}
.mod .meta{text-align:right;font-size:.85rem;color:var(--muted);white-space:nowrap}
.mod .meta b{display:block;color:var(--ink);font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.15rem}
.foot{margin-top:28px;color:var(--muted);font-size:.85rem;max-width:70ch}

/* intro */
.back{background:none;border:0;color:var(--muted);padding:4px 0;margin-bottom:12px}
.intro-h{display:flex;align-items:baseline;gap:14px;margin:0 0 6px}
.intro-h .no{font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:2.6rem;font-weight:700;color:var(--accent);line-height:1}
.intro-h h2{margin:0;font-size:1.7rem}
.intro-body{max-width:68ch}
.intro-body p{margin:.6em 0}
.ctrls{background:var(--panel);border-left:4px solid var(--accent);padding:10px 14px;margin:16px 0;font-size:.95rem}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.primary,.secondary{border-radius:8px;padding:12px 22px;font-weight:700;border:2px solid var(--ink)}
.primary{background:var(--ink);color:var(--bg)}
.secondary{background:transparent}
.opt-line{display:flex;gap:8px;align-items:center;font-size:.95rem;margin-top:10px}

/* run bar */
.runbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.runbar-top{display:flex;align-items:center;gap:12px}
.runbar-top .t{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;font-weight:700}
.badge.practice{background:var(--panel2);color:var(--muted)}
.badge.test{background:var(--accent);color:var(--accent-ink)}
#timerText{font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}
.abort{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.85rem;color:var(--muted)}
.tbar{height:4px;background:var(--panel2);margin-top:8px;border-radius:2px;overflow:hidden}
#timerBar{height:100%;background:var(--accent);width:100%;transition:width .2s linear}

/* result */
.res-score{font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:4.5rem;font-weight:700;line-height:1;margin:10px 0 0}
.res-label{color:var(--muted)}
.res-tbl{border-collapse:collapse;margin:20px 0;min-width:280px}
.res-tbl td{padding:8px 16px 8px 0;border-bottom:1px solid var(--line)}
.res-tbl td:last-child{text-align:right;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.15rem;font-weight:600}
.newbest{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:2px 10px;border-radius:4px;margin-top:10px}

/* feedback flashes */
.flash-ok{box-shadow:0 0 0 3px var(--ok) inset !important}
.flash-ng{box-shadow:0 0 0 3px var(--ng) inset !important}
.fb{min-height:1.7em;font-weight:700;text-align:center}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)}

/* multitask */
.mt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.mt-grid{grid-template-columns:1fr}}
.mt-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s}
.mt-panel h3{margin:0;font-size:.95rem;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-weight:600;color:var(--muted)}
.mt-shapes{display:flex;justify-content:space-between;align-items:center;min-height:64px;color:var(--ink)}
.mt-eq{font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.75rem;font-weight:600;text-align:center;min-height:64px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.mt-audio{min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.3rem}
.mt-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.mt-btns button{padding:12px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);font-weight:700;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.1rem}
.mt-btns button:disabled{opacity:.4;cursor:default}
.mt-sc{font-size:.85rem;color:var(--muted);text-align:center}

/* calc */
.calc{max-width:640px;margin:0 auto}
.calc-sec{color:var(--muted);font-size:.9rem}
.calc-q{font-size:1.25rem;line-height:1.7;margin:10px 0 18px;min-height:3.4em}
.calc-opts{display:grid;gap:8px}
.calc-opts button{text-align:left;padding:12px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);font-family:"Barlow Semi Condensed","BIZ UDPGothic",system-ui,sans-serif;font-size:1.25rem;font-weight:600;display:flex;gap:14px;align-items:center}
.calc-opts button .k{color:var(--muted);font-size:.9rem;width:1.2em}
.calc-opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.calc-opts button.wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 12%,var(--panel))}
.expl{background:var(--panel2);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:.95rem}
.calc-inter{text-align:center;padding:40px 10px}
.calc-inter h2{font-size:1.8rem;margin:.2em 0}
.memo{color:var(--muted);font-size:.85rem;margin-top:14px}

/* agility */
.agi{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:10px}
.agi-pair{display:flex;gap:18px}
.agi-cell{width:clamp(110px,30vw,170px);aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.agi-btn{width:min(360px,90%);padding:22px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.4rem;font-weight:700;touch-action:manipulation}
.agi-btn:active{transform:translateY(1px)}
.stat{color:var(--muted);font-size:.9rem}

/* observation */
.obs{display:flex;flex-direction:column;align-items:center;gap:14px}
.obs canvas{display:block;touch-action:manipulation}
.obs-opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(420px,100%)}
.obs-opts button{padding:14px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.5rem;font-weight:700;touch-action:manipulation}

/* spatial */
.spa-q{text-align:center;font-weight:700;color:var(--ink);font-size:.95rem;margin:0 auto 14px;max-width:62ch;line-height:1.5}
.spa-inst{display:flex;justify-content:center;gap:18px;background:#e9eaeb;border:2px solid #333;border-radius:16px;padding:14px 22px 8px;width:max-content;max-width:100%;margin:0 auto 18px}
.inst{display:flex;flex-direction:column;align-items:center;color:#222;font-size:.9rem}
.inst svg{width:clamp(120px,34vw,180px);height:auto}
.spa-row{display:flex;justify-content:center;align-items:center;gap:clamp(20px,6vw,70px);flex-wrap:wrap}
.spa-map{display:flex;flex-direction:column;align-items:center}
.spa-n{background:#9aa0a6;color:#111;font-weight:700;padding:0 10px;font-family:"Barlow Semi Condensed",system-ui,sans-serif}
.spa-grid{display:grid;grid-template-columns:repeat(3,clamp(62px,17vw,86px));grid-auto-rows:clamp(62px,17vw,86px);border:1px solid #999}
.zone{border:1px solid #bbb;background:linear-gradient(180deg,#e6e6e6,#d9d9d9);display:flex;align-items:center;justify-content:center;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.9rem;font-weight:600;color:#888;position:relative;touch-action:none}
.zone.hover{outline:3px solid var(--sel);outline-offset:-3px}
.zone.center{background:radial-gradient(circle,#fff 0,#ccc 70%,#999)}
.zone .placed svg{width:80%;height:auto}
.zone .placed{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#ddd}
.zone.ans{outline:3px dashed var(--ok);outline-offset:-4px}
.spa-planes{display:grid;grid-template-columns:repeat(2,clamp(62px,17vw,86px));grid-auto-rows:clamp(62px,17vw,86px);border:1px solid #999}
.ptile{border:1px solid #bbb;background:linear-gradient(90deg,#cfcfcf,#f3f3f3 60%,#ddd);display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
.ptile svg{width:70%;height:auto;pointer-events:none}
.ptile.sel{outline:3px solid var(--sel);outline-offset:-3px}
.ptile.empty{visibility:hidden}
.ghost{position:fixed;width:70px;height:70px;pointer-events:none;z-index:50;transform:translate(-50%,-50%);opacity:.85}
.spa-actions{display:flex;justify-content:center;margin-top:18px}
.spa-fb{max-width:60ch;margin:12px auto 0;text-align:center}

/* control */
.ctl{display:flex;flex-direction:column;align-items:center;gap:12px}
.ctl-hud{display:flex;gap:22px;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1rem;color:var(--muted)}
.ctl-hud b{color:var(--ink);font-size:1.4rem;margin-left:6px}
.ctl canvas{display:block;touch-action:none;border-radius:50%}
.ctl-pads{display:flex;gap:28px;align-items:center}
.stick{width:132px;height:132px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--ink);opacity:.85}
.boost{padding:18px 20px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:1.1rem;touch-action:manipulation}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.audio-set{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px}
.audio-set select{font:inherit;font-size:.9rem;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:min(320px,70vw)}
.secondary.small{padding:6px 14px;font-size:.9rem}
@media (prefers-reduced-motion: reduce){#timerBar{transition:none}}
</style>
</head>
<body>
<div class="wrap">

<section class="screen" id="home">
  <div class="hero">
    <svg viewBox="-100 -100 200 200" aria-hidden="true" id="heroDial"></svg>
    <h1>FCAT 適性検査トレーナー</h1>
  </div>
  <p class="lede">本番と同じく、各ジャンルに「練習」と「本番」があります。練習は短時間で解説つき、本番は実際に近い制限時間で解説なしです。問題は毎回ランダムに生成されるので、苦手なジャンルは繰り返して慣れてください。</p>
  <div class="mods" id="modList"></div>
  <p class="foot">共有された体験談をもとに再現した練習用ツールで、実際の出題形式・採点方法とは異なる場合があります。応用計算は電卓なしを想定しているので、メモ用紙を手元に用意してください。ベストスコアはこのブラウザにだけ保存されます。</p>
</section>

<section class="screen" id="intro" hidden></section>

<section class="screen" id="run" hidden>
  <div class="runbar">
    <div class="runbar-top">
      <span class="t" id="runTitle"></span>
      <span class="badge" id="runMode"></span>
      <span id="timerText"></span>
      <button class="abort" id="abortBtn">中断</button>
    </div>
    <div class="tbar"><div id="timerBar"></div></div>
  </div>
  <div id="stage"></div>
</section>

<section class="screen" id="result" hidden></section>
</div>

<script>
/* ---------- utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const randf=(a,b)=>Math.random()*(b-a)+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function fmt(n){const dp=Math.abs(n)<1?4:2;const r=Math.round(n*10**dp)/10**dp;return r.toLocaleString('en-US',{maximumFractionDigits:dp})}
function fmtTime(s){s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0)}
const settings={textAudio:false,rate:store.get('fcat_rate2')||1};
const player=new Audio();player.preload='auto';
function playWord(w,onEnd){player.onended=null;player.pause();player.src=WORD_AUDIO[w];player.playbackRate=settings.rate;
  if('preservesPitch' in player)player.preservesPitch=true;player.onended=onEnd;
  const pr=player.play();if(pr&&pr.catch)pr.catch(()=>onEnd&&onEnd('err'))}
function speakTest(){const seq=['runway','signal','harbor'];let i=0;const nx=()=>{if(i<seq.length)playWord(seq[i++],()=>setTimeout(nx,400))};nx()}

/* ---------- shapes ---------- */
const STAR='50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38';
const CROSS='38,10 62,10 62,38 90,38 90,62 62,62 62,90 38,90 38,62 10,62 10,38 38,38';
const SH={
  circle:'<circle cx="50" cy="50" r="38"/>',
  square:'<rect x="15" y="15" width="70" height="70"/>',
  triangle:'<polygon points="50,10 90,86 10,86"/>',
  cross:`<polygon points="${CROSS}"/>`,
  x:`<polygon points="${CROSS}" transform="rotate(45 50 50)"/>`,
  star:`<polygon points="${STAR}"/>`,
  diamond:'<polygon points="50,6 90,50 50,94 10,50"/>',
  heart:'<path d="M50 88 C22 68 8 50 8 34 A21 21 0 0 1 50 26 A21 21 0 0 1 92 34 C92 50 78 68 50 88Z"/>',
  hexagon:'<polygon points="50,6 88,28 88,72 50,94 12,72 12,28"/>',
  triL:'<polygon points="10,50 88,12 88,88"/>',
  triR:'<polygon points="90,50 12,12 12,88"/>'
};
const shapeSVG=(t,size=48)=>`<svg viewBox="0 0 100 100" width="${size}" height="${size}" fill="currentColor" aria-hidden="true">${SH[t]}</svg>`;

/* ---------- instruments ---------- */
const PLANE='M0,-56 L7,-42 L7,-14 L50,8 L50,17 L7,7 L5,34 L19,45 L19,52 L0,46 L-19,52 L-19,45 L-5,34 L-7,7 L-50,17 L-50,8 L-7,-14 L-7,-42 Z';
function dialMarks(){
  let s='';
  for(let a=0;a<360;a+=5){
    const L=a%30===0?13:a%10===0?9:5;const r=86;
    const x1=Math.sin(a*Math.PI/180)*r,y1=-Math.cos(a*Math.PI/180)*r;
    const x2=Math.sin(a*Math.PI/180)*(r-L),y2=-Math.cos(a*Math.PI/180)*(r-L);
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#eee" stroke-width="${a%30===0?2:1.2}"/>`;
  }
  const lab={0:'N',90:'E',180:'S',270:'W'};
  for(let a=0;a<360;a+=30){
    s+=`<text transform="rotate(${a}) translate(0,-62)" fill="#f2f2f2" font-size="${lab[a]?15:13}" font-family="Barlow Semi Condensed,Arial,sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">${lab[a]||a/10}</text>`;
  }
  return s;
}
const DIAL=dialMarks();
function bezel(){
  let s=`<circle r="99" fill="#6a6d70"/><circle r="94" fill="#2a2d30"/><circle r="91" fill="#1d2023"/>`;
  for(let a=0;a<360;a+=45) s+=`<polygon points="0,-91 -5,-83 5,-83" fill="#f07a1a" transform="rotate(${a})"/>`;
  return s;
}
function gyroSVG(hd){
  return bezel()+`<g transform="rotate(${-hd})">${DIAL}</g><path d="${PLANE}" fill="none" stroke="#f07a1a" stroke-width="3" stroke-linejoin="round"/>`;
}
function rbiSVG(rb){
  return bezel()+DIAL+`<line x1="0" y1="-91" x2="0" y2="-74" stroke="#f07a1a" stroke-width="3"/>
  <g transform="rotate(${rb})"><line x1="0" y1="80" x2="0" y2="-60" stroke="#f5e000" stroke-width="5"/><polygon points="0,-82 -10,-58 10,-58" fill="#f5e000"/></g>
  <g transform="scale(.28)"><path d="${PLANE}" fill="#e2401a"/></g>`;
}
const planeTile=hd=>`<svg viewBox="-60 -60 120 120" aria-hidden="true"><path d="${PLANE}" fill="#111" transform="rotate(${hd})"/></svg>`;
$('#heroDial').innerHTML=rbiSVG(135);

/* =====================================================
   1. MULTITASK
   ===================================================== */

const WORDS=Object.keys(WORD_AUDIO);
function runMulti(stage,ctx){
  stage.innerHTML=`<div class="mt-grid">
  <section class="mt-panel" id="pA"><h3>Task 1 — Which way does the triangle point?</h3>
    <div class="mt-shapes" id="mtShapes"></div>
    <div class="mt-btns"><button data-v="L">Left<kbd>←</kbd></button><button data-v="R">Right<kbd>→</kbd></button></div>
    <div class="mt-sc num" id="scA"></div></section>
  <section class="mt-panel" id="pB"><h3>Task 2 — Is the equation correct?</h3>
    <div class="mt-eq" id="mtEq"></div>
    <div class="mt-btns"><button data-v="T">True<kbd>T</kbd></button><button data-v="F">False<kbd>F</kbd></button></div>
    <div class="mt-sc num" id="scB"></div></section>
  <section class="mt-panel" id="pC"><h3>Task 3 — Did any word appear twice?</h3>
    <div class="mt-audio" id="mtAud"></div>
    <div class="mt-btns"><button data-v="Y">Yes<kbd>Y</kbd></button><button data-v="N">No<kbd>N</kbd></button></div>
    <div class="mt-sc num" id="scC"></div></section></div>`;
  const sc={A:[0,0],B:[0,0],C:[0,0]};
  let A,B,C={ready:false},stopped=false,timers=[];
  const T=(f,ms)=>{const id=setTimeout(f,ms);timers.push(id);return id};
  const flash=(id,ok)=>{const el=$('#'+id,stage);el.classList.remove('flash-ok','flash-ng');void el.offsetWidth;el.classList.add(ok?'flash-ok':'flash-ng');T(()=>el.classList.remove('flash-ok','flash-ng'),260)};
  const upd=()=>{for(const k of 'ABC')$('#sc'+k,stage).textContent=`Correct ${sc[k][0]}  /  Wrong ${sc[k][1]}`};
  function newA(){
    const pool=shuffle(['circle','square','star','heart','diamond','cross','hexagon']).slice(0,4);
    const dir=Math.random()<.5?'L':'R';const pos=rand(0,4);pool.splice(pos,0,dir==='L'?'triL':'triR');
    A={dir};$('#mtShapes',stage).innerHTML=pool.map(t=>shapeSVG(t,46)).join('');
  }
  function newB(){
    const n=[rand(1,9)];let v=n[0],s=String(n[0]);
    for(let i=0;i<4;i++){const x=rand(1,9);const plus=Math.random()<.55||v-x<-9;v+=plus?x:-x;s+=(plus?' + ':' − ')+x}
    const ok=Math.random()<.5;const shown=ok?v:v+pick([-3,-2,-1,1,2,3]);
    B={ok};$('#mtEq',stage).textContent=`${s} = ${shown}`;
  }
  function newC(){
    const w=shuffle(WORDS).slice(0,5);const dup=Math.random()<.5;
    if(dup){const i=rand(1,4);w[i]=w[rand(0,i-1)]}
    C={dup,ready:false};
    const box=$('#mtAud',stage);setBtns(false);
    let i=0;
    const done=()=>{if(stopped)return;C.ready=true;setBtns(true);box.textContent='Answer now'};
    if(settings.textAudio){
      const step=()=>{if(stopped)return;if(i>=w.length){done();return}box.textContent=w[i++];T(()=>{box.textContent='';T(step,250)},750)};
      step();
    }else{
      box.textContent='♪ Listening…';
      const next=()=>{if(stopped)return;if(i>=w.length){done();return}
        const word=w[i++];let fired=false;
        const go=err=>{if(fired)return;fired=true;if(err==='err'){box.textContent=word;T(()=>box.textContent='',700)}T(next,err==='err'?950:550)};
        T(go,2500);playWord(word,go);
        box.textContent=`♪ Listening… ${i}/5`;
      };
      next();
    }
  }
  function setBtns(on){stage.querySelectorAll('#pC button').forEach(b=>b.disabled=!on)}
  function ans(task,v){
    if(stopped)return;
    if(task==='A'){const ok=v===A.dir;sc.A[ok?0:1]++;flash('pA',ok);newA()}
    if(task==='B'){const ok=(v==='T')===B.ok;sc.B[ok?0:1]++;flash('pB',ok);newB()}
    if(task==='C'){if(!C.ready)return;C.ready=false;setBtns(false);const ok=(v==='Y')===C.dup;sc.C[ok?0:1]++;flash('pC',ok);$('#mtAud',stage).textContent=ok?'✓':'✗';T(newC,700)}
    upd();
  }
  stage.querySelectorAll('#pA button').forEach(b=>b.onclick=()=>ans('A',b.dataset.v));
  stage.querySelectorAll('#pB button').forEach(b=>b.onclick=()=>ans('B',b.dataset.v));
  stage.querySelectorAll('#pC button').forEach(b=>b.onclick=()=>ans('C',b.dataset.v));
  newA();newB();newC();upd();
  return{
    keydown(e){const k=e.key.toLowerCase();
      if(k==='arrowleft'){ans('A','L');return true} if(k==='arrowright'){ans('A','R');return true}
      if(k==='t')ans('B','T'); if(k==='f')ans('B','F'); if(k==='y')ans('C','Y'); if(k==='n')ans('C','N');},
    stop(){stopped=true;timers.forEach(clearTimeout);player.onended=null;player.pause();
      const ok=sc.A[0]+sc.B[0]+sc.C[0],ng=sc.A[1]+sc.B[1]+sc.C[1];
      return{score:ok,scoreLabel:'総正答数',lines:[['三角形（視覚）',`${sc.A[0]} 正 / ${sc.A[1]} 誤`],['計算の正誤（視覚）',`${sc.B[0]} 正 / ${sc.B[1]} 誤`],['単語の重複（聴覚）',`${sc.C[0]} 正 / ${sc.C[1]} 誤`],['正答率',ok+ng?Math.round(ok/(ok+ng)*100)+'%':'—']]}}
  };
}

/* =====================================================
   2. APPLIED CALCULATION (English)
   ===================================================== */
function mkOpts(ans,dis,unit){
  const f=v=>fmt(v)+(unit?' '+unit:'');

  }

/* =====================================================
   4. OBSERVATION — balls bounce off the wall like a ball off a floor
   (the "floor" is wherever on the circle the ball hits). Each flight is a
   parabola from wall point A to wall point B with its apex inside the
   circle. Every ball takes the same time per flight, so all balls reach
   their apex together — and that is the instant everything freezes.
   ===================================================== */
function runObs(stage,ctx){
  stage.innerHTML=`<div class="obs"><div class="stat num" id="obsInfo"></div><canvas id="cv"></canvas><div class="obs-opts" id="opts"></div><div class="fb" id="obsFb"></div></div>`;

  const R=S/2-6,br=Math.max(8,S*.027),C=S/2,Rr=R-br-1,TAU=Math.PI*2;
  const col={line:css('--line'),bg:css('--panel'),ball:css('--accent')};
  let lvl=6,N=6,maxN=6,balls=[],phase='run',raf,stopped=false,ok=0,ng=0,locked=false,last=0;
  const period=()=>Math.max(950,(ctx.practice?1800:1500)-(N-6)*55);
  // how slow the balls get around the apex (fraction of normal speed); gets less forgiving as balls increase
  const slowRate=()=>Math.min(.3,(ctx.practice?.06:.1)+(N-6)*.02);
  const W=a=>[Math.cos(a)*Rr,Math.sin(a)*Rr];
  const bez=(b,u)=>{const v=1-u;return[v*v*b.A[0]+2*v*u*b.K[0]+u*u*b.B[0],v*v*b.A[1]+2*v*u*b.K[1]+u*u*b.B[1]]};
  function flight(b,taken){
    for(let k=0;k<80;k++){
      const phi=b.dir*randf(.3,.95)*Math.PI,a1=b.a0+phi,ma=b.a0+phi/2,m=Rr*Math.cos(Math.abs(phi)/2);
      const lo=-.55*Rr,hi=Math.max(lo+.05*Rr,Math.min(m-.25*Rr,.6*Rr));
      const ra=randf(lo,hi),ap=[Math.cos(ma)*ra,Math.sin(ma)*ra];
      if(taken.some(t=>Math.hypot(t[0]-ap[0],t[1]-ap[1])<br*2.7))continue;
      const A=W(b.a0),B=W(a1),M=[(A[0]+B[0])/2,(A[1]+B[1])/2],K=[2*ap[0]-M[0],2*ap[1]-M[1]];
      const cand={A,B,K};let inside=true;
      for(let s=1;s<10;s++){const p=bez(cand,s/10);if(Math.hypot(p[0],p[1])>Rr+.5){inside=false;break}}
      if(!inside)continue;
      if(k>40&&Math.random()<.5)b.dir*=-1;
      Object.assign(b,cand,{a1,ap});taken.push(ap);return;
    }
    b.dir*=-1;const a1=b.a0+b.dir*.6*Math.PI,A=W(b.a0),B=W(a1),ma=b.a0+b.dir*.3*Math.PI,ap=[Math.cos(ma)*Rr*.2,Math.sin(ma)*Rr*.2],M=[(A[0]+B[0])/2,(A[1]+B[1])/2];
    Object.assign(b,{A,B,K:[2*ap[0]-M[0],2*ap[1]-M[1]],a1,ap});taken.push(ap);
  }
  const assign=()=>{const taken=[];balls.forEach(b=>flight(b,taken))};
  function newRound(){
    balls=[];for(let i=0;i<N;i++)balls.push({a0:Math.random()*TAU,dir:Math.random()<.5?1:-1});
    assign();phase='run';uDraw=0;last=0;locked=false;
    const st=Math.max(1,N-rand(0,4));
    $('#opts',stage).innerHTML=[0,1,2,3,4].map(i=>`<button data-n="${st+i}">${st+i}</button>`).join('');
    stage.querySelectorAll('#opts button').forEach(b=>b.onclick=()=>answer(+b.dataset.n));
    $('#obsInfo',stage).textContent=`正解 ${ok}　不正解 ${ng}`;
  }
  function answer(n){
    if(locked||stopped)return;locked=true;const right=n===N;const fb=$('#obsFb',stage);
    if(right){ok++;fb.textContent='正解';fb.className='fb ok';lvl++}
    else{ng++;fb.textContent=`不正解（${N} 個）`;fb.className='fb ng';lvl=Math.max(6,lvl-1)}
    // difficulty level climbs with each correct answer, but the actual count jitters around it
    // (−1 to +2) so the next answer can't be predicted; never repeat the same count twice in a row

    g.fillStyle=col.ball;
    for(const b of balls){const p=bez(b,uDraw);g.beginPath();g.arc(C+p[0],C+p[1],br,0,TAU);g.fill()}
    raf=requestAnimationFrame(step);
  }
  newRound();raf=requestAnimationFrame(step);
  return{keydown(e){const btns=stage.querySelectorAll('#opts button');const i='12345'.indexOf(e.key);if(i>=0&&btns[i])answer(+btns[i].dataset.n)},
    stop(){stopped=true;cancelAnimationFrame(raf);return{score:ok,scoreLabel:'正答数',lines:[['正解',ok],['不正解',ng],['到達した最大の玉数',maxN+' 個']]}}};
}

  function place(zone,hd){if(phase!=='ask')return;placed={zone,hd};sel=null;render()}
  stage.querySelectorAll('.zone[data-zone]').forEach(z=>z.addEventListener('click',()=>{
    const n=+z.dataset.zone;if(phase!=='ask')return;
    if(sel!==null)place(n,sel);else if(placed&&placed.zone===n){placed=null;render()}
  }));
  function bindTray(){
    stage.querySelectorAll('.ptile').forEach(t=>t.addEventListener('pointerdown',e=>{
      if(phase!=='ask')return;const hd=+t.dataset.hd;const sx=e.clientX,sy=e.clientY;let ghost=null,over=null;
      const mv=ev=>{if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=planeTile(hd);document.body.appendChild(ghost)}
        if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';const el=document.elementFromPoint(ev.clientX,ev.clientY);const z=el&&el.closest('.zone[data-zone]');if(over&&over!==z)over.classList.remove('hover');over=z;if(z)z.classList.add('hover')}};
      const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
        if(over)over.classList.remove('hover');
        if(ghost){ghost.remove();if(over)place(+over.dataset.zone,hd)}else{sel=sel===hd?null:hd;render()}};
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
    }));
  }
  $('#nx',stage).onclick=()=>{
    if(stopped)return;
    if(phase==='review'){newQ();return}
    if(!placed){$('#sfb',stage).innerHTML='<span class="fb ng">飛行機を選んでゾーンに置いてください</span>';return}
    const right=placed.hd===q.hd&&placed.zone===q.zone;right?ok++:ng++;
    if(!ctx.practice){newQ();return}
    phase='review';stage.querySelector(`.zone[data-zone="${q.zone}"]`).classList.add('ans');
    $('#sfb',stage).innerHTML=`<div class="fb ${right?'ok':'ng'}">${right?'正解':'不正解'}</div><div class="expl" style="text-align:left">GYRO：機首方位は ${DIRS[q.hd/45]}。RBI：局は機体から見て${REL[q.rb/45]}（${q.rb}°）なので、局は機体の ${DIRS[q.stIdx]} にある。つまり機体は局の ${DIRS[q.dirIdx]} 側 → ゾーン ${q.zone}（点線枠）。</div>`;
    $('#nx',stage).textContent='次の問題';
  };
  newQ();
  return{keydown(e){if(e.key==='Enter'){$('#nx',stage).click();return true}},
    stop(){stopped=true;document.querySelectorAll('.ghost').forEach(g=>g.remove());return{score:ok,scoreLabel:'正答数',lines:[['正解',ok],['不正解',ng],['正答率',ok+ng?Math.round(ok/(ok+ng)*100)+'%':'—']]}}};
}

/* =====================================================
   6. CONTROL
   ===================================================== */
function genHoles(){
  const P=Math.PI;return pick([
    ()=>[{t:'rect',cx:randf(-.3,.3),cy:randf(-.3,.3),w:.62,h:.42}],
    ()=>[{t:'rect',cx:0,cy:randf(-.25,.25),w:1.7,h:.3}],
    ()=>[0,1,2].map(i=>({t:'circ',cx:Math.cos(i*2*P/3)*.55,cy:Math.sin(i*2*P/3)*.55,r:.23})),
    ()=>[{t:'circ',cx:0,cy:0,r:.26},{t:'sec',r1:.4,r2:.9,a1:0,a2:P/2}],
    ()=>[{t:'sec',r1:0,r2:.9,a1:0,a2:P*.6}],
    ()=>[{t:'circ',cx:-.5,cy:0,r:.3},{t:'circ',cx:.5,cy:0,r:.3}]
  ])();
}
function inHoles(holes,x,y){
  const m=.035;
  return holes.some(h=>{
    if(h.t==='rect')return Math.abs(x-h.cx)<h.w/2-m&&Math.abs(y-h.cy)<h.h/2-m;
    if(h.t==='circ')return Math.hypot(x-h.cx,y-h.cy)<h.r-m;
    const r=Math.hypot(x,y);let a=Math.atan2(y,x);if(a<0)a+=Math.PI*2;
    return r>h.r1+(h.r1?m:0)&&r<h.r2-m&&a>h.a1+m/Math.max(r,.05)&&a<h.a2-m/Math.max(r,.05);
  });
}
function holePath(g,h){
  if(h.t==='rect'){g.rect(h.cx-h.w/2,h.cy-h.h/2,h.w,h.h)}
  else if(h.t==='circ'){g.moveTo(h.cx+h.r,h.cy);g.arc(h.cx,h.cy,h.r,0,Math.PI*2)}
  else if(h.r1===0){g.moveTo(0,0);g.arc(0,0,h.r2,h.a1,h.a2);g.closePath()}
  else{g.moveTo(Math.cos(h.a1)*h.r2,Math.sin(h.a1)*h.r2);g.arc(0,0,h.r2,h.a1,h.a2);g.arc(0,0,h.r1,h.a2,h.a1,true);g.closePath()}
}
function runCtl(stage,ctx){
  stage.innerHTML=`<div class="ctl"><div class="ctl-hud"><span>SCORE<b id="cS">0</b></span><span>SPEED<b id="cV">40</b></span><span>HIT<b id="cH">0</b></span></div>
  <canvas id="cv"></canvas><div class="ctl-pads"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="boost" id="boost">SPEED +<kbd style="color:inherit;border-color:currentColor">Space</kbd></button></div>
  <p class="hint">スティックをドラッグ、または矢印キー / WASD で照準を動かし、穴をくぐらせてください。</p></div>`;
  const cv=$('#cv',stage),g=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  const S=Math.min(460,stage.clientWidth-8);cv.style.width=cv.style.height=S+'px';cv.width=cv.height=S*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  const C=S/2,R0=S/2-4,ZF=7,GAP=2.3;
  const col={tun:css('--tunnel'),obs:css('--obs'),acc:css('--accent'),ng:css('--ng'),line:css('--line')};
  let p={x:0,y:0},joy={x:0,y:0},keys={},speed=40,maxSpeed=40,score=0,hits=0,obs=[],flashT=0,stopped=false,raf,last=0;
  obs.push({z:ZF-2.5,holes:genHoles(),rot:Math.random()*Math.PI*2});
  const boost=()=>{speed=Math.min(100,speed+8);maxSpeed=Math.max(maxSpeed,speed)};
  $('#boost',stage).addEventListener('pointerdown',e=>{e.preventDefault();boost()});
  const stick=$('#stick',stage),knob=$('#knob',stage);
  stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);mv(e)});
  stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))mv(e)});
  const rel=()=>{joy={x:0,y:0};knob.style.transform=''};
  stick.addEventListener('pointerup',rel);stick.addEventListener('pointercancel',rel);
  function mv(e){const r=stick.getBoundingClientRect(),rr=r.width/2-14;let x=(e.clientX-r.left-r.width/2)/rr,y=(e.clientY-r.top-r.height/2)/rr;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}joy={x,y};knob.style.transform=`translate(${x*rr}px,${y*rr}px)`}
  function step(t){
    if(stopped)return;const dt=Math.min(.05,(t-(last||t))/1000);last=t;
    let vx=joy.x+((keys.ArrowRight||keys.d)?1:0)-((keys.ArrowLeft||keys.a)?1:0),vy=joy.y+((keys.ArrowDown||keys.s)?1:0)-((keys.ArrowUp||keys.w)?1:0);
    const m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}
    p.x+=vx*1.5*dt;p.y+=vy*1.5*dt;const pm=Math.hypot(p.x,p.y);if(pm>.92){p.x*=.92/pm;p.y*=.92/pm}
    const dz=(.8+speed/100*3)*dt;
    for(const o of obs)o.z-=dz;
    for(const o of obs){if(!o.done&&o.z<=1){o.done=true;
      const c=Math.cos(-o.rot),s=Math.sin(-o.rot),lx=p.x*c-p.y*s,ly=p.x*s+p.y*c;
      if(inHoles(o.holes,lx,ly)){score++;speed=Math.min(100,speed+3);maxSpeed=Math.max(maxSpeed,speed)}else{hits++;speed=40;flashT=.35}}}
    obs=obs.filter(o=>!o.done);
    if(!obs.length||obs[obs.length-1].z<ZF-GAP)obs.push({z:ZF,holes:genHoles(),rot:Math.random()*Math.PI*2});
    flashT=Math.max(0,flashT-dt);
    // draw
    g.clearRect(0,0,S,S);
    g.beginPath();g.arc(C,C,R0,0,Math.PI*2);g.fillStyle=col.tun;g.fill();
    for(let k=1;k<=4;k++){g.beginPath();g.arc(C,C,R0/(1+k*1.4),0,Math.PI*2);g.strokeStyle=col.line;g.lineWidth=1;g.stroke()}
    for(const o of obs.slice().sort((a,b)=>b.z-a.z)){
      const r=R0/o.z;g.save();g.globalAlpha=Math.max(0,Math.min(1,(ZF-o.z)/1.6));g.translate(C,C);g.scale(r,r);g.rotate(o.rot);
      g.beginPath();g.arc(0,0,1,0,Math.PI*2);o.holes.forEach(h=>holePath(g,h));g.fillStyle=col.obs;g.fill('evenodd');
      g.lineWidth=2/r;g.strokeStyle=col.tun;g.stroke();g.restore();
    }
    const px=C+p.x*R0,py=C+p.y*R0;g.strokeStyle=col.acc;g.lineWidth=3;
    g.beginPath();g.arc(px,py,8,0,Math.PI*2);g.moveTo(px-15,py);g.lineTo(px-4,py);g.moveTo(px+4,py);g.lineTo(px+15,py);g.moveTo(px,py-15);g.lineTo(px,py-4);g.moveTo(px,py+4);g.lineTo(px,py+15);g.stroke();
    if(flashT>0){g.globalAlpha=flashT;g.beginPath();g.arc(C,C,R0,0,Math.PI*2);g.fillStyle=col.ng;g.fill();g.globalAlpha=1}
    $('#cS',stage).textContent=score;$('#cV',stage).textContent=Math.round(speed);$('#cH',stage).textContent=hits;
    raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
  return{keydown(e){if(e.key===' '){boost();return true}const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(k)){keys[k]=true;return true}},
    keyup(e){const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false},
    stop(){stopped=true;cancelAnimationFrame(raf);return{score,scoreLabel:'避けた枚数',lines:[['通過',score],['衝突',hits],['最高速度',Math.round(maxSpeed)]]}}};
}

/* =====================================================
   MODULE DEFINITIONS & RUNNER
   ===================================================== */
const MODULES=[
  {id:'multi',name:'マルチタスク',time:[60,180],run:runMulti,sum:'三角形の向き・計算の正誤・英単語の重複を同時にさばく（英語表示）',
   desc:`<p>3つの課題が同時に表示され、どれかに答えるとその課題だけが次へ切り替わります。正答数が多いほど高得点なので、1つに集中しすぎず順番に回すのがコツです。</p><p>課題1は5つの図形の中から三角形を見つけて向き（左か右か）を答えます。課題2は左辺の計算結果が右辺と等しいかを判定します。課題3は読み上げられる英単語5個の中に同じ単語が2回出たかを答えます。課題3は5語すべて聞き終わってから回答できます。</p>`,
   keys:'課題1：← / →　課題2：T / F　課題3：Y / N（画面のボタンでも回答可）',extra:true},
  {id:'calc',name:'応用計算',time:[240,960],run:runCalc,own:true,sum:'円の面積・体積・単位換算・比率の4セクション（英語・計16分）',
   desc:`<p>問題文は英語です。4つのセクションに分かれ、それぞれに制限時間があります（本番は各4分、練習は各1分）。5択から答えを選びます。電卓なしを想定しているので、紙とペンを用意してください。</p><p>よく使う換算：km/h ÷ 3.6 = m/s、1 kt = 1.852 km/h、1 ft = 0.3048 m、1 m³ = 1000 L。必要な係数は問題文に書いてあります。</p>`,
   keys:'選択肢：A〜E または 1〜5　練習の次の問題：Enter'},
  {id:'agi',name:'俊敏力',time:[45,120],run:runAgi,sum:'2つの図形が同じときだけ素早くボタンを押す',
   desc:`<p>2つの図形が次々に切り替わります。左右が同じ図形のときだけボタンを押してください。正しく押すほど切り替えが速くなります。違う図形で押すと減点です。</p>`,
   keys:'Space または Enter（スマホは「同じ！」ボタン）'},
  {id:'obs',name:'観察力',time:[60,180],run:runObs,sum:'弾む玉が一斉に頂点でスローになる間に個数を数える',
   desc:`<p>玉は円の壁で跳ね返り続けます。床で弾むボールと同じで、どこの壁（上・下・横）で反射した玉も、内側に向かって減速しながら頂点まで上がり、また壁へ戻っていきます。全部の玉が同じリズムで弾むので、頂点に達するタイミングは全員同じで、その前後で一斉にスローになります。そのスローの間に数える（覚える）のがポイントです。</p><p>5つの選択肢から個数を選んでください。最初は6個前後で、正解を重ねるほど玉の数は増えていきますが、毎回の個数はランダムに上下するので前の答えから予測はできません。間違えると少し易しくなります。玉が増えるほど動きが速く、スローも短く浅くなります。</p>`,
   keys:'選択肢：1〜5キー（左から順）またはタップ'},
  {id:'spa',name:'空間認識',time:[60,180],run:runSpa,sum:'GYRO と RBI を読み、正しい向きの機体を正しいゾーンへ',
   desc:`<p>GYRO は機首方位を示します（上に来ている方位が進行方向）。RBI は上が常に機首方向で、黄色い矢印の先が無線局のある方向です。右の4機から GYRO の方位に飛んでいる機体を選び、局（中央）から見た自機の位置のゾーンに置いてください。</p><p>考え方：局は機体から見て「機首方位 + 相対方位」の方向にある → 機体はその反対側にいる。例：機首 S（180°）、矢印が右後方（135°）なら局は 315°（NW）方向 → 機体は局の SE、ゾーン4。</p>`,
   keys:'機体をドラッグしてゾーンへ（タップで選択 → ゾーンをタップでも可）　回答確定：Next / Enter'},
  {id:'ctl',name:'制御能力',time:[45,150],run:runCtl,sum:'迫ってくる穴あき円盤を照準で避け続ける',
   desc:`<p>穴の開いた円盤が次々と迫ってきます。照準を穴の位置に合わせて通過させてください。連続で通過すると速度が上がり（最大100）、ぶつかると速度40からやり直しです。SPEED + で自分から加速もできます。通過した枚数がスコアです。</p>`,
   keys:'移動：スティック / 矢印キー / WASD　加速：Space または SPEED + ボタン'}
];

function renderHome(){
  $('#modList').innerHTML=MODULES.map((m,i)=>{const b=store.get('fcat_best_'+m.id);
    return`<button class="mod" data-i="${i}"><span class="no">${i+1}</span><span><span class="nm">${m.name}</span><span class="sm">${m.sum}</span></span><span class="meta">本番 ${fmtTime(m.time[1])}<b>${b!=null?'ベスト '+b.score:'未受験'}</b></span></button>`}).join('');
  document.querySelectorAll('.mod').forEach(b=>b.onclick=()=>openIntro(MODULES[+b.dataset.i]));
}
function openIntro(m){
  const i=MODULES.indexOf(m);const b=store.get('fcat_best_'+m.id);
  $('#intro').innerHTML=`<button class="back" id="bk">← メニューへ</button>
  <div class="intro-h"><span class="no">${i+1}</span><h2>${m.name}</h2></div>
  <div class="intro-body">${m.desc}<div class="ctrls">${m.keys}</div>
  ${m.extra?`<div class="audio-set">
    <label class="opt-line">読み上げ速度 <select id="rSel"><option value="0.85">ゆっくり</option><option value="1">標準</option><option value="1.15">速め</option></select></label>
    <button class="secondary small" id="vTest">試聴</button>
    <label class="opt-line"><input type="checkbox" id="txtA" ${settings.textAudio?'checked':''}> 音声の代わりに英単語を文字で表示</label></div>`:''}
  <p style="color:var(--muted);font-size:.9rem">練習 ${fmtTime(m.time[0])}　本番 ${fmtTime(m.time[1])}${b!=null?'　ベスト '+b.score:''}</p></div>
  <div class="btnrow"><button class="secondary" id="pr">練習する</button><button class="primary" id="ts">本番を始める</button></div>`;
  $('#bk').onclick=()=>{renderHome();show('home')};
  if(m.extra){$('#txtA').onchange=e=>settings.textAudio=e.target.checked;
    const rs=$('#rSel');rs.value=String(settings.rate);rs.onchange=e=>{settings.rate=+e.target.value;store.set('fcat_rate2',settings.rate)};
    $('#vTest').onclick=speakTest;}
  $('#pr').onclick=()=>startModule(m,true);$('#ts').onclick=()=>startModule(m,false);
  show('intro');
}

let current=null,tState=null;
function startTimer(sec,label,onEnd){
  stopTimer();const t0=performance.now();
  const tick=()=>{const rem=Math.max(0,sec-(performance.now()-t0)/1000);$('#timerText').textContent=fmtTime(rem);$('#timerBar').style.width=(rem/sec*100)+'%';if(rem<=0){stopTimer();onEnd()}};
  tState={id:setInterval(tick,200)};tick();
}
function stopTimer(){if(tState){clearInterval(tState.id);tState=null}}
function startModule(m,practice){
  show('run');$('#runTitle').textContent=m.name;const md=$('#runMode');md.textContent=practice?'練習':'本番';md.className='badge '+(practice?'practice':'test');
  const stage=$('#stage');stage.innerHTML='';
  const ctx={practice,timer:startTimer,finish:()=>finish(false),idle:t=>{stopTimer();$('#timerText').textContent='待機';$('#timerBar').style.width='100%'}};
  current={m,practice};
  current.ctl=m.run(stage,ctx);
  if(!m.own)startTimer(practice?m.time[0]:m.time[1],'',()=>finish(false));
}
function finish(aborted){
  if(!current)return;stopTimer();const{m,practice,ctl}=current;current=null;const res=ctl.stop();
  if(aborted){openIntro(m);return}
  let best=false;
  if(!practice){const b=store.get('fcat_best_'+m.id);if(!b||res.score>b.score){store.set('fcat_best_'+m.id,{score:res.score,at:Date.now()});best=!!b||true}}
  $('#result').innerHTML=`<button class="back" id="rbk">← メニューへ</button>
  <h2 style="margin:0">${m.name}　${practice?'練習':'本番'}の結果</h2>
  <div class="res-score">${res.score}</div><div class="res-label">${res.scoreLabel}</div>
  ${best?'<div class="newbest">ベストスコア更新</div>':''}
  <table class="res-tbl">${res.lines.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>
  <div class="btnrow"><button class="secondary" id="again">${practice?'練習をもう一度':'本番をもう一度'}</button>${practice?'<button class="primary" id="totest">本番を始める</button>':''}<button class="secondary" id="tomenu">メニューへ</button></div>`;
  $('#rbk').onclick=$('#tomenu').onclick=()=>{renderHome();show('home')};
  $('#again').onclick=()=>startModule(m,practice);
  if(practice)$('#totest').onclick=()=>startModule(m,false);
  show('result');
}
$('#abortBtn').onclick=()=>finish(true);
document.addEventListener('keydown',e=>{if(!current||!current.ctl.keydown||e.repeat&&e.key!==' '&&!e.key.startsWith('Arrow'))return;if(e.target.tagName==='INPUT')return;
  if(current.ctl.keydown(e)||e.key===' '||e.key.startsWith('Arrow'))e.preventDefault()});
document.addEventListener('keyup',e=>{if(current&&current.ctl.keyup)current.ctl.keyup(e)});
renderHome();
</script>
